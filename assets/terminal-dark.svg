<svg xmlns="http://www.w3.org/2000/svg" width="760" height="335" viewBox="0 0 760 335" role="img" aria-label="about"><style>.ln{clip-path:inset(0 100% 0 0);}@keyframes tp{to{clip-path:inset(0 0 0 0);}}@keyframes bl{0%,49%{opacity:1;}50%,100%{opacity:0;}}.cur{animation:bl 1.1s steps(1) infinite;}</style><rect x="0.5" y="0.5" width="759" height="334" rx="8" fill="none" stroke="#8B949E" stroke-opacity="0.25"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><text class="ln" style="animation:tp 0.25s steps(6) both;animation-delay:0.25s" x="18" y="31" xml:space="preserve"><tspan fill="#2DD4BF">$ </tspan><tspan fill="#C9D1D9">whoami</tspan></text><text class="ln" style="animation:tp 0.90s steps(41) both;animation-delay:0.72s" x="34" y="53" fill="#8B949E" xml:space="preserve">shreyas tiwari — cs undergrad, vit bhopal</text><text class="ln" style="animation:tp 0.29s steps(13) both;animation-delay:1.74s" x="18" y="97" xml:space="preserve"><tspan fill="#2DD4BF">$ </tspan><tspan fill="#C9D1D9">cat focus.txt</tspan></text><text class="ln" style="animation:tp 1.14s steps(52) both;animation-delay:2.25s" x="34" y="119" fill="#8B949E" xml:space="preserve">python · llms · retrieval · prompt engineering · dsa</text><text class="ln" style="animation:tp 0.37s steps(17) both;animation-delay:3.51s" x="18" y="163" xml:space="preserve"><tspan fill="#2DD4BF">$ </tspan><tspan fill="#C9D1D9">cat principle.txt</tspan></text><text class="ln" style="animation:tp 0.86s steps(39) both;animation-delay:4.11s" x="34" y="185" fill="#8B949E" xml:space="preserve">small sharp tools over big vague ideas.</text><text class="ln" style="animation:tp 1.14s steps(52) both;animation-delay:5.08s" x="34" y="207" fill="#8B949E" xml:space="preserve">a model is only as good as the reasoning feeding it.</text><text class="ln" style="animation:tp 0.25s steps(5) both;animation-delay:6.35s" x="18" y="251" xml:space="preserve"><tspan fill="#2DD4BF">$ </tspan><tspan fill="#C9D1D9">./now</tspan></text><text class="ln" style="animation:tp 1.10s steps(50) both;animation-delay:6.82s" x="34" y="273" fill="#8B949E" xml:space="preserve">squeezing a leaf-disease model small enough to run</text><text class="ln" style="animation:tp 0.95s steps(43) both;animation-delay:8.04s" x="34" y="295" fill="#8B949E" xml:space="preserve">on a solar-powered pi, offline, in a field.</text><rect class="cur" x="18" y="305.0" width="8" height="14" fill="#2DD4BF" style="animation-delay:9.10s"/></g></svg>